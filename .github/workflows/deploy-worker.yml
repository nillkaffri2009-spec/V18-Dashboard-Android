name: Deploy V20 Asosiy 3 Cloud Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", "tests/**", ".github/workflows/deploy-worker.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify data parser and controller handover
        run: node --test tests/v20.test.mjs
      - name: Deploy existing dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc
      - name: Verify deployed version and Google Sheets
        run: |
          curl --retry 3 --retry-delay 2 --fail --silent --show-error 'https://v18-dashboard-server.nill-kaffri-2009.workers.dev/api/health' -o /tmp/v20-health.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/v20-health.json'));if(h.version!=='20.4-cloud')process.exit(1);console.log('Version:',h.version);"
          curl --retry 2 --retry-delay 2 --fail --silent --show-error --max-time 60 'https://v18-dashboard-server.nill-kaffri-2009.workers.dev/api/google-test' -o /tmp/v20-data-check.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/v20-data-check.json'));if(!d.ok||!d.totalRecords||d.errors.length)process.exit(1);console.log(JSON.stringify({records:d.totalRecords,counts:d.countsByMonth},null,2));"
