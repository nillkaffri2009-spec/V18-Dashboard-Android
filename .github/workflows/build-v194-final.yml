name: Build V19.4 FINAL APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v194-final.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: V19.4 FINAL workflow marker
        shell: bash
        run: |
          echo "V19.4 FINAL WORKFLOW LOADED"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app release
          mkdir -p app/src/main/java/com/v18/dashboard
          mkdir -p app/src/main/res/values
          mkdir -p release

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "V18Dashboard"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.v18.dashboard'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.v18.dashboard'
                  minSdk 23
                  targetSdk 35
                  versionCode 19401
                  versionName '19.4-cloud'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="V18 Dashboard"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#17395F</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/v18/dashboard/MainActivity.java <<'EOF'
          package com.v18.dashboard;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView webView;

              private static final String PHONE_URL =
                  "https://v18-dashboard-server.nill-kaffri-2009.workers.dev/phone?mode=phone&app=android&v=19.4";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createWebView();

                  if (savedInstanceState == null) {
                      loadDashboard();
                  } else if (webView.restoreState(savedInstanceState) == null) {
                      loadDashboard();
                  }
              }

              private void createWebView() {
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  String ua = s.getUserAgentString();
                  s.setUserAgentString(ua + " V18DashboardPhone/19.4");

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new DashboardClient());
              }

              private void loadDashboard() {
                  if (webView != null) {
                      webView.loadUrl(PHONE_URL);
                  }
              }

              private class DashboardClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(
                      WebView view, WebResourceRequest request) {

                      String url = request.getUrl().toString();

                      return !url.startsWith(
                          "https://v18-dashboard-server.nill-kaffri-2009.workers.dev/");
                  }

                  @Override
                  public void onPageStarted(WebView view, String url, Bitmap favicon) {
                      super.onPageStarted(view, url, favicon);
                  }

                  @Override
                  public void onReceivedError(
                      WebView view,
                      WebResourceRequest request,
                      WebResourceError error) {

                      super.onReceivedError(view, request, error);

                      if (request.isForMainFrame()) {
                          showConnectionError();
                      }
                  }
              }

              private void showConnectionError() {
                  runOnUiThread(() -> {
                      LinearLayout box = new LinearLayout(this);
                      box.setOrientation(LinearLayout.VERTICAL);
                      box.setGravity(Gravity.CENTER);
                      box.setPadding(48, 48, 48, 48);
                      box.setBackgroundColor(Color.WHITE);

                      TextView title = new TextView(this);
                      title.setText("V18 Dashboard серверига уланиб бўлмади");
                      title.setTextSize(22);
                      title.setTextColor(Color.rgb(23, 57, 95));
                      title.setGravity(Gravity.CENTER);

                      TextView info = new TextView(this);
                      info.setText(
                          "\nИнтернетни текширинг ва ҚАЙТА УЛАНИШ тугмасини босинг."
                      );
                      info.setTextSize(17);
                      info.setTextColor(Color.DKGRAY);
                      info.setGravity(Gravity.CENTER);

                      Button retry = new Button(this);
                      retry.setText("ҚАЙТА УЛАНИШ");
                      retry.setOnClickListener(v -> {
                          createWebView();
                          loadDashboard();
                      });

                      box.addView(title);
                      box.addView(info);
                      box.addView(retry);
                      setContentView(box);
                  });
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) {
                      webView.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.removeAllViews();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          cp "$APK" "release/V18-Dashboard-V19.4-CLOUD-PHONE.apk"
          sha256sum "release/V18-Dashboard-V19.4-CLOUD-PHONE.apk" \
            > "release/V18-Dashboard-V19.4-CLOUD-PHONE.sha256.txt"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V18-DASHBOARD-V19.4-CLOUD-PHONE
          path: |
            release/V18-Dashboard-V19.4-CLOUD-PHONE.apk
            release/V18-Dashboard-V19.4-CLOUD-PHONE.sha256.txt
          if-no-files-found: error
          retention-days: 30
