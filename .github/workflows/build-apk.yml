name: Build V18 Dashboard APK

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "V18_KUNLIK_DAVOMAD_PC_MONITOR_PHONE_FIXED.zip"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract V18
        run: |
          rm -rf extracted web
          mkdir -p extracted web
          unzip -o V18_KUNLIK_DAVOMAD_PC_MONITOR_PHONE_FIXED.zip -d extracted

          if [ -f "extracted/index.html" ]; then
            cp -r extracted/. web/
          elif [ -f "extracted/v18/index.html" ]; then
            cp -r extracted/v18/. web/
          else
            INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html not found in ZIP"
              find extracted -maxdepth 3 -type f | head -100
              exit 1
            fi

            WEB_DIR=$(dirname "$INDEX_FILE")
            cp -r "$WEB_DIR"/. web/
          fi

          echo "=== WEB FILES ==="
          ls -la web

          test -f web/index.html || {
            echo "ERROR: web/index.html missing"
            exit 1
          }

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/v18/dashboard
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp -r web/. app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "V18Dashboard"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.v18.dashboard'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.v18.dashboard'
                  minSdk 23
                  targetSdk 35
                  versionCode 19
                  versionName '18.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="V18 Dashboard"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/v18/dashboard/MainActivity.java <<'EOF'
          package com.v18.dashboard;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V18-KUNLIK-DAVOMAD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
