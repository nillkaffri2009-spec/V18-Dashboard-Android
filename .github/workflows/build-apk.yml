name: Build V19.4 Cloud Phone APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. REPOSITORY
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        run: |
          echo "=== Creating V18 Phone LIVE Android project ==="

          rm -rf app
          rm -rf release

          mkdir -p app/src/main/java/com/v18/dashboard
          mkdir -p app/src/main/res/values
          mkdir -p release

          # -----------------------------------------------------
          # settings.gradle
          # -----------------------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "V18Dashboard"
          include(":app")
          EOF

          # -----------------------------------------------------
          # Root build.gradle
          # -----------------------------------------------------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # -----------------------------------------------------
          # gradle.properties
          # -----------------------------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # -----------------------------------------------------
          # app/build.gradle
          # -----------------------------------------------------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.v18.dashboard'
              compileSdk 35
