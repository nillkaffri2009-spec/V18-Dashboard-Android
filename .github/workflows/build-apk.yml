      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          mkdir -p release
          cp "$APK" "release/V18-Dashboard-V19.4-CLOUD-PHONE.apk"
          sha256sum "release/V18-Dashboard-V19.4-CLOUD-PHONE.apk" \
            > "release/V18-Dashboard-V19.4-CLOUD-PHONE.sha256.txt"

          cat > release/BUILD-INFO.txt <<'EOF'
          V18 Dashboard Android APK
          Version: 19.4-cloud
          Mode: PHONE ONLY
          Server: Cloudflare V18 Dashboard Cloud Server
          PC server required: NO
          URL: https://v18-dashboard-server.nill-kaffri-2009.workers.dev/phone?mode=phone

          Notes:
          - Requires Internet connection.
          - APK navigation is locked to the V18 phone dashboard host/mode.
          - If Android reports an app-signature conflict with an older debug APK,
            uninstall the older APK first, then install this build.
          EOF

          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V18-DASHBOARD-V19.4-CLOUD-PHONE
          path: |
            release/V18-Dashboard-V19.4-CLOUD-PHONE.apk
            release/V18-Dashboard-V19.4-CLOUD-PHONE.sha256.txt
            release/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
