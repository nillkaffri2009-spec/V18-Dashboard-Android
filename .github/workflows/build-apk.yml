name: Build V20 Asosiy 3 Variant 3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. REPOSITORY
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        run: |
          echo "=== Creating V20 Phone LIVE Android project ==="

          rm -rf app
          rm -rf release

          mkdir -p app/src/main/java/com/mamuriyat/asosiy3/v20
          mkdir -p app/src/main/res/values
          mkdir -p release

          # -----------------------------------------------------
          # settings.gradle
          # -----------------------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "V20Dashboard"
          include(":app")
          EOF

          # -----------------------------------------------------
          # Root build.gradle
          # -----------------------------------------------------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # -----------------------------------------------------
          # gradle.properties
          # -----------------------------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # -----------------------------------------------------
          # app/build.gradle
          # -----------------------------------------------------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mamuriyat.asosiy3.v20'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mamuriyat.asosiy3.v20'
                  minSdk 23
                  targetSdk 35

                  versionCode 20003
                  versionName '20.3'
              }
          }
          EOF

          # -----------------------------------------------------
          # AndroidManifest.xml
          # -----------------------------------------------------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="V20 Asosiy 3"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # -----------------------------------------------------
          # styles.xml
          # -----------------------------------------------------
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#1976D2</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          EOF

          # =====================================================
          # MainActivity.java
          # =====================================================
          cat > app/src/main/java/com/mamuriyat/asosiy3/v20/MainActivity.java <<'EOF'
          package com.mamuriyat.asosiy3.v20;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.content.Context;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.TextView;
          import android.widget.LinearLayout;
          import android.widget.Button;
          import android.graphics.Color;
          import android.view.Gravity;

          public class MainActivity extends Activity {

              private WebView webView;
              private ConnectivityManager connectivityManager;
              private ConnectivityManager.NetworkCallback networkCallback;
              private final Handler reconnectHandler = new Handler(Looper.getMainLooper());

              // =================================================
              // V18 SERVER
              // =================================================
              private static final String SERVER_URL =
                      "https://v18-dashboard-server.nill-kaffri-2009.workers.dev/phone?mode=phone&v=20.3";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createWebView();
                  registerNetworkMonitor();

                  if (savedInstanceState == null) {

                      loadDashboard();

                  } else {

                      boolean restored =
                              webView.restoreState(savedInstanceState) != null;

                      if (!restored) {
                          loadDashboard();
                      }
                  }
              }

              // =================================================
              // CREATE WEBVIEW
              // =================================================
              private void createWebView() {

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  // JavaScript
                  settings.setJavaScriptEnabled(true);

                  // HTML5 Local Storage
                  settings.setDomStorageEnabled(true);

                  // Database
                  settings.setDatabaseEnabled(true);

                  // Network
                  settings.setBlockNetworkLoads(false);

                  // File/content
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  // Responsive dashboard
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  // Zoom
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  // JS windows
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  // Media
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  // Cache
                  settings.setCacheMode(
                          WebSettings.LOAD_DEFAULT
                  );

                  // HTTP + HTTPS mixed content
                  settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  // User Agent marker
                  String oldUA = settings.getUserAgentString();

                  settings.setUserAgentString(
                          oldUA + " V20DashboardPhone/20.3"
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient()
                  );

                  webView.setWebViewClient(
                          new DashboardWebViewClient()
                  );
              }

              // =================================================
              // LOAD DASHBOARD
              // =================================================
              private void loadDashboard() {

                  if (webView != null) {

                      webView.loadUrl(SERVER_URL);

                  }
              }

              // =================================================
              // WEBVIEW CLIENT
              // =================================================
              private class DashboardWebViewClient
                      extends WebViewClient {

                  @Override
                  public boolean shouldOverrideUrlLoading(
                          WebView view,
                          WebResourceRequest request) {

                      android.net.Uri target = request.getUrl();
                      return !("https".equals(target.getScheme()) &&
                              "v18-dashboard-server.nill-kaffri-2009.workers.dev".equals(target.getHost()));
                  }

                  @Override
                  public void onPageStarted(
                          WebView view,
                          String url,
                          Bitmap favicon) {

                      super.onPageStarted(
                              view,
                              url,
                              favicon
                      );
                  }

                  @Override
                  public void onPageFinished(
                          WebView view,
                          String url) {

                      super.onPageFinished(
                              view,
                              url
                      );
                  }

                  @Override
                  public void onReceivedError(
                          WebView view,
                          WebResourceRequest request,
                          WebResourceError error) {

                      super.onReceivedError(
                              view,
                              request,
                              error
                      );

                      if (request.isForMainFrame()) {

                          showConnectionError();

                      }
                  }
              }

              // =================================================
              // NETWORK AUTO-RECONNECT
              // Wi-Fi <-> Mobile almashganda sahifa avtomatik qayta ulanadi.
              // =================================================
              private void registerNetworkMonitor() {
                  connectivityManager =
                          (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);

                  networkCallback = new ConnectivityManager.NetworkCallback() {
                      @Override
                      public void onAvailable(Network network) {
                          scheduleReconnect();
                      }

                  };

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          connectivityManager.registerDefaultNetworkCallback(networkCallback);
                      } else {
                          NetworkRequest request = new NetworkRequest.Builder()
                                  .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                                  .build();
                          connectivityManager.registerNetworkCallback(request, networkCallback);
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void scheduleReconnect() {
                  reconnectHandler.removeCallbacksAndMessages(null);
                  reconnectHandler.postDelayed(() -> reconnectDashboard(), 900);
              }

              private void reconnectDashboard() {
                  if (webView == null) {
                      createWebView();
                  }

                  String liveUrl = SERVER_URL
                          + "&network_refresh="
                          + System.currentTimeMillis();

                  webView.loadUrl(liveUrl);
              }

              // =================================================
              // CONNECTION ERROR SCREEN
              // =================================================
              private void showConnectionError() {

                  runOnUiThread(() -> {

                      LinearLayout layout =
                              new LinearLayout(this);

                      layout.setOrientation(
                              LinearLayout.VERTICAL
                      );

                      layout.setGravity(
                              Gravity.CENTER
                      );

                      layout.setPadding(
                              50,
                              50,
                              50,
                              50
                      );

                      layout.setBackgroundColor(
                              Color.WHITE
                      );

                      TextView title =
                              new TextView(this);

                      title.setText(
                              "V20 Asosiy 3 серверига уланиб бўлмади"
                      );

                      title.setTextSize(24);

                      title.setTextColor(
                              Color.rgb(20, 58, 95)
                      );

                      title.setGravity(
                              Gravity.CENTER
                      );

                      TextView info =
                              new TextView(this);

                      info.setText(
                              "\nCloud Dashboard серверига уланиб бўлмади.\n\n" +
                              "Текширинг:\n\n" +
                              "1. Интернет уланган бўлсин.\n" +
                              "2. Wi-Fi ёки мобил тармоқ ишласин.\n" +
                              "3. Тармоқ алмашса APK автоматик қайта уланади.\n\n" +
                              "Сўнг ҚАЙТА УЛАНИШ тугмасини босинг."
                      );

                      info.setTextSize(18);

                      info.setTextColor(
                              Color.DKGRAY
                      );

                      info.setGravity(
                              Gravity.CENTER
                      );

                      Button retry =
                              new Button(this);

                      retry.setText(
                              "ҚАЙТА УЛАНИШ"
                      );

                      retry.setTextSize(18);

                      retry.setOnClickListener(v -> {

                          createWebView();

                          reconnectDashboard();

                      });

                      layout.addView(title);

                      layout.addView(info);

                      layout.addView(retry);

                      setContentView(layout);

                  });
              }

              // =================================================
              // SAVE STATE
              // =================================================
              @Override
              protected void onSaveInstanceState(
                      Bundle outState) {

                  if (webView != null) {

                      webView.saveState(
                              outState
                      );

                  }

                  super.onSaveInstanceState(
                          outState
                  );
              }

              // =================================================
              // BACK BUTTON
              // =================================================
              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }

              // =================================================
              // DESTROY
              // =================================================
              @Override
              protected void onDestroy() {

                  try {
                      if (connectivityManager != null && networkCallback != null) {
                          connectivityManager.unregisterNetworkCallback(networkCallback);
                      }
                  } catch (Exception ignored) {
                  }

                  reconnectHandler.removeCallbacksAndMessages(null);

                  if (webView != null) {

                      webView.stopLoading();

                      webView.clearHistory();

                      webView.removeAllViews();

                      webView.destroy();

                      webView = null;

                  }

                  super.onDestroy();
              }
          }
          EOF

          echo "======================================"
          echo "ANDROID PROJECT CREATED"
          echo "SERVER:"
          echo "https://v18-dashboard-server.nill-kaffri-2009.workers.dev/phone?mode=phone&v=20.3"
          echo "======================================"

      # =========================================================
      # 4. GRADLE
      # =========================================================
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # =========================================================
      # 5. BUILD APK
      # =========================================================
      - name: Build APK
        run: |
          echo "=== BUILDING APK ==="

          gradle clean assembleDebug --no-daemon

          echo "=== APK OUTPUT ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -ls

          if [ ! -f \
            "app/build/outputs/apk/debug/app-debug.apk" ]; then

            echo "ERROR: APK was not created"

            exit 1

          fi

          echo "APK build successful."

      # =========================================================
      # 6. RENAME APK
      # =========================================================
      - name: Verify APK signature and package
        run: |
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Rename APK
        run: |
          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/V20_ASOSIY_3_PHONE_3_VARIANT.apk

          echo "=== RELEASE APK ==="

          ls -lh release/

      # =========================================================
      # 7. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V20_ASOSIY_3_PHONE_3_VARIANT
          path: release/V20_ASOSIY_3_PHONE_3_VARIANT.apk
          if-no-files-found: error
          retention-days: 30
