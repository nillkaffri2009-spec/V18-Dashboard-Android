name: Build V18 Dashboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "V18_ASOSIY_DESIGN_2_CONTROL_SYNC_FIXED.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check source ZIP
        run: |
          echo "=== REPOSITORY FILES ==="
          ls -lah

          if [ ! -f "V18_ASOSIY_DESIGN_2_CONTROL_SYNC_FIXED.zip" ]; then
            echo "ERROR: V18_ASOSIY_DESIGN_2_CONTROL_SYNC_FIXED.zip not found"
            exit 1
          fi

          echo "Source ZIP found."

      - name: Extract V18
        run: |
          rm -rf extracted web
          mkdir -p extracted web

          unzip -o V18_ASOSIY_DESIGN_2_CONTROL_SYNC_FIXED.zip -d extracted

          echo "=== EXTRACTED FILES ==="
          find extracted -maxdepth 4 -type f | head -200

          if [ -f "extracted/index.html" ]; then
            WEB_DIR="extracted"

          elif [ -f "extracted/v18/index.html" ]; then
            WEB_DIR="extracted/v18"

          elif [ -f "extracted/web/index.html" ]; then
            WEB_DIR="extracted/web"

          else
            INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html not found inside ZIP"
              exit 1
            fi

            WEB_DIR=$(dirname "$INDEX_FILE")
          fi

          echo "Dashboard directory: $WEB_DIR"

          cp -r "$WEB_DIR"/. web/

          echo "=== WEB FILES ==="
          find web -maxdepth 3 -type f | head -200

          if [ ! -f "web/index.html" ]; then
            echo "ERROR: web/index.html missing"
            exit 1
          fi

          echo "Dashboard web package OK."

      - name: Create Android project
        run: |
          rm -rf app

          mkdir -p app/src/main/java/com/v18/dashboard
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp -r web/. app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "V18Dashboard"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.v18.dashboard'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.v18.dashboard'
                  minSdk 23
                  targetSdk 35
                  versionCode 20
                  versionName '18.2'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="V18 Dashboard"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/v18/dashboard/MainActivity.java <<'EOF'
          package com.v18.dashboard;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  );

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  if (savedInstanceState == null) {
                      webView.loadUrl(
                          "file:///android_asset/index.html?mode=phone"
                      );
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              protected void onRestoreInstanceState(Bundle savedInstanceState) {
                  super.onRestoreInstanceState(savedInstanceState);
                  webView.restoreState(savedInstanceState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.clearHistory();
                      webView.removeAllViews();
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          echo "Android project created."

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle clean assembleDebug --no-daemon

          echo "=== APK OUTPUT ==="
          find app/build/outputs/apk -type f -name "*.apk" -ls

          test -f app/build/outputs/apk/debug/app-debug.apk || {
            echo "ERROR: APK was not created"
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
             release/V18-Dashboard-18.2-PHONE-SYNC.apk

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V18-ASOSIY-DESIGN-2-PHONE-SYNC-APK
          path: release/V18-Dashboard-18.2-PHONE-SYNC.apk
          if-no-files-found: error
          retention-days: 30
